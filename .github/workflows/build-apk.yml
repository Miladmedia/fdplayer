name: Build FD Player APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Download Vazirmatn fonts if missing
        shell: bash
        run: |
          set -e
          FONT_DIR=app/src/main/res/font
          mkdir -p "$FONT_DIR"
          BASE="https://github.com/rastikerdar/vazirmatn/raw/v33.003/fonts/ttf"
          for pair in Light:light Regular:regular Medium:medium Bold:bold; do
            src="${pair%%:*}"; dst="vazirmatn_${pair##*:}.ttf"
            if [ ! -s "$FONT_DIR/$dst" ]; then
              echo "Downloading $src"
              curl -fL --retry 3 -o "$FONT_DIR/$dst" "$BASE/Vazirmatn-$src.ttf"
            fi
          done
          ls -l "$FONT_DIR"

      - name: Generate Gradle wrapper if missing
        shell: bash
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint (non-blocking)
        run: ./gradlew lintDebug || true
        continue-on-error: true

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FD-Player-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
